name: Automação de ofertas

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar posts de ofertas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ secrets.AMAZON_CREDENTIAL_VERSION || '3.1' }}
          AFFILIATE_LINKS: ${{ secrets.AFFILIATE_LINKS }}
          SEARCH_TERMS: ${{ secrets.SEARCH_TERMS }}
          MAX_OFERTAS: ${{ secrets.MAX_OFERTAS }}
        run: python src/builder.py

      - name: Commit e push dos novos posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/
          if git diff --staged --quiet; then
            echo "Nenhum post novo para publicar."
            exit 0
          fi
          git commit -m "chore: novas ofertas geradas automaticamente"
          git push
